name: Check actions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit and local integration tests
        run: npm test
      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.2.0
      - name: Real Helm packaging integration
        run: npm run test:helm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate workflows and composite actions
        run: npm run lint
      - name: Check shell scripts
        run: shellcheck helm-oci-chart/publish.sh make-ko-publish/publish.sh
      - name: Exercise exists action
        id: exists
        uses: ./exists
        with:
          value: example
      - name: Exercise empty input
        id: empty
        uses: ./exists
        with:
          value: ''
      - name: Assert exists outputs
        env:
          PRESENT: ${{ steps.exists.outputs.result }}
          EMPTY: ${{ steps.empty.outputs.result }}
        run: test "$PRESENT" = true && test "$EMPTY" = false
