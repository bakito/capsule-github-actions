name: Task ko publish
description: Publish a ko image via Task, generate and attach a CycloneDX SBOM, and optionally sign the image.
inputs:
  taskfile-target:
    required: true
    description: Single Task target that prints only the immutable image reference to stdout.
  registry:
    required: true
    description: Registry host.
  registry-username:
    required: true
    description: Registry username passed to Task as REGISTRY_USERNAME.
  registry-password:
    required: true
    description: Registry password passed to Task as REGISTRY_PASSWORD.
  repository:
    required: true
    description: Repository passed as REPO and the default REPOSITORY environment value.
  version:
    required: false
    description: Image tag passed to Task as VERSION.
  version-required:
    required: false
    default: 'true'
    description: Reject an empty version.
  sign-image:
    required: false
    default: 'false'
    description: Sign the image using an already installed Cosign.
  sbom-name:
    required: true
    description: Base name of the CycloneDX SBOM file.
  sbom-repository:
    required: true
    description: Repository for the attached SBOM.
  signature-repository:
    required: false
    description: Optional override for the Cosign signature repository.
  main-path:
    required: true
    description: Path to the Go entry point.
outputs:
  digest:
    value: ${{ steps.publish.outputs.digest }}
    description: Published image sha256 digest.
  image:
    value: ${{ steps.publish.outputs.image }}
    description: Full immutable image reference.
runs:
  using: composite
  steps:
    - name: Publish image
      id: publish
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TASKFILE_TARGET: ${{ inputs.taskfile-target }}
        REGISTRY: ${{ inputs.registry }}
        REPO: ${{ inputs.repository }}
        REPOSITORY: ${{ env.REPOSITORY || inputs.repository }}
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
        REGISTRY_PASSWORD: ${{ inputs.registry-password }}
        VERSION: ${{ inputs.version }}
        VERSION_REQUIRED: ${{ inputs.version-required }}
        SIGN_IMAGE: ${{ inputs.sign-image }}
        SBOM_NAME: ${{ inputs.sbom-name }}
        COSIGN_REPOSITORY: ${{ inputs.sbom-repository }}
      run: bash "$ACTION_PATH/publish.sh"
    - name: Install CycloneDX generator
      uses: CycloneDX/gh-gomod-generate-sbom@efc74245d6802c8cefd925620515442756c70d8f # v2.0.0
      with:
        version: v1
    - name: Generate SBOM
      shell: bash
      env:
        SBOM_NAME: ${{ inputs.sbom-name }}
        MAIN_PATH: ${{ inputs.main-path }}
      run: cyclonedx-gomod app -licenses -json -output "$SBOM_NAME-bom.cdx.json" -main "$MAIN_PATH"
    - name: Upload SBOM
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.sbom-name }}-bom-cdx
        path: ${{ inputs.sbom-name }}-bom.cdx.json
        if-no-files-found: error
    - name: Sign image
      if: inputs.sign-image == 'true'
      shell: bash
      env:
        IMAGE: ${{ steps.publish.outputs.image }}
        COSIGN_REPOSITORY: ${{ inputs.signature-repository }}
      run: cosign sign --yes -a "repo=$GITHUB_REPOSITORY" -a "workflow=$GITHUB_WORKFLOW" -a "ref=$GITHUB_SHA" "$IMAGE"
    - name: Attach SBOM
      shell: bash
      env:
        IMAGE: ${{ steps.publish.outputs.image }}
        SBOM_NAME: ${{ inputs.sbom-name }}
        COSIGN_REPOSITORY: ${{ inputs.sbom-repository }}
      run: cosign attach sbom --sbom "$SBOM_NAME-bom.cdx.json" --type cyclonedx "$IMAGE"
